[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/solstice-theme",
    "apps/solstice-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.dependencies]
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
solstice-theme = { path = "crates/solstice-theme" }
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
