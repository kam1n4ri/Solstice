[package]
name = "solstice-native"
version = "0.1.0"
edition = "2021"
description = "Solstice Native Creative and Productivity Workstation"

[lib]
name = "solstice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"

[lints]
workspace = true
